<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Page Example</title>
  <style>
    body {
      background-color: rgb(232, 167, 238); /* page background */
    }
  </style>
</head>
<body>
  <h1 style="color:rgb(79, 3, 46);font-size:32px; text-align:center;">Internal CSS</h1>
  <p style="color:rgb(90, 3, 105); font-size:26px;">Internal CSS is a method of adding styles directly inside an HTML file using the style tag. it is written inside the head section of an HTML document.</p>
</body>
</html>
